<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Callback</title>
<meta name="description" content="Remember who to reach out to, when, and why. An outreach tracker for photographers." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#175ba9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Callback" />
<link rel="apple-touch-icon" href="icons/icon-1024.png" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />

<script>
  // Light or dark is a per-device choice kept in localStorage, set before the
  // first paint so the page never flashes the wrong theme.
  try {
    var t = localStorage.getItem('callback-appearance');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <main id="view" class="view" tabindex="-1"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <a class="tab" href="#/today" data-tab="today">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    <span class="tab-label">Today</span>
  </a>
  <a class="tab" href="#/week" data-tab="week">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
    <span class="tab-label">Week</span>
  </a>
  <a class="tab" href="#/people" data-tab="people">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.5.2 4.3 1.9 5 4.9"/></svg></span>
    <span class="tab-label">People</span>
  </a>
  <a class="tab" href="#/circles" data-tab="circles">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-dasharray="3.2 2.6" stroke-linecap="butt"/><circle cx="12" cy="8.6" r="1.9" fill="currentColor" stroke="none"/><circle cx="8.6" cy="14.4" r="1.9" fill="currentColor" stroke="none"/><circle cx="15.4" cy="14.4" r="1.9" fill="currentColor" stroke="none"/></svg></span>
    <span class="tab-label">Circles</span>
  </a>
  <a class="tab" href="#/orgs" data-tab="orgs">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h10v17"/><path d="M14 9h6v12"/><path d="M2 21h20"/><path d="M7.5 8h3M7.5 12h3M7.5 16h3M17 13v.01M17 17v.01"/></svg></span>
    <span class="tab-label">Orgs</span>
  </a>
  <a class="tab" href="#/settings" data-tab="settings">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>
    <span class="tab-label">Settings</span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="noscript">Callback needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
