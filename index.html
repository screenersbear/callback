<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- interactive-widget (the page shrinks for the keyboard) only on Android, whose browsers know it: Safari logs an error for it. -->
<script>if (/Android/i.test(navigator.userAgent)) document.querySelector('meta[name="viewport"]').content += ', interactive-widget=resizes-content';</script>
<title>Callback</title>
<meta name="description" content="Remember who to reach out to, when, and why. An outreach tracker for photographers." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12850f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Callback" />
<link rel="apple-touch-icon" href="icons/icon-1024.png" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />

<script>
  // Light only (11-11): an old light/dark pick is cleared.
  try {
    localStorage.removeItem('callback-appearance');
    // The app's colour, if it isn't the green (Your buddy, or Settings).
    var g = localStorage.getItem('callback-green');
    if (g && /^#[0-9a-f]{6}$/i.test(g)) {
      document.documentElement.style.setProperty('--green', g);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', g);
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css" />
<script src="js/upright.js"></script>
</head>
